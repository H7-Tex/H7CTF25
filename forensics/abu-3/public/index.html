<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGF: Part 2 - Crown of Blood and Gold</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>KGF 2.0</h1>
            <p class="subtitle">Hard-Tier Forensics Challenge</p>
        </header>

        <div class="instructions">
            <h3>INSTRUCTIONS</h3>
            <ul>
                <li>This is the advanced continuation of KGF 1.0</li>
                <li>Use the same <code>compromised.tar</code> container snapshot</li>
                <li>These challenges require deeper binary analysis and unpacking</li>
                <li>Submit all answers to receive the flag</li>
            </ul>
        </div>

        <form id="challengeForm">
            <!-- Question 9 -->
            <div class="question">
                <label for="q9">
                    <span class="qnum">Question 9 (350 pts):</span>
                    The malware verifies the integrity of the downloaded scanner using an MD5 checksum. What is the expected MD5 hash value? (lowercase)
                </label>
                <input type="text" id="q9" name="q9" placeholder="Enter MD5 hash" data-length="32" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 10 -->
            <div class="question">
                <label for="q10">
                    <span class="qnum">Question 10 (250 pts):</span>
                    The malware's scanning script checks for specific Linux distributions. How many letters are in the name of the distribution it explicitly checks for (all lowercase)?
                </label>
                <input type="text" id="q10" name="q10" placeholder="Enter number" data-length="1" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 11 -->
            <div class="question">
                <label for="q11">
                    <span class="qnum">Question 11 (400 pts):</span>
                    After unpacking the miner binary using <code>upx -d</code>, extract the primary mining pool's fully qualified domain name (FQDN). Do NOT include the protocol prefix or port number.
                </label>
                <input type="text" id="q11" name="q11" placeholder="Enter FQDN only" data-length="21" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 12 -->
            <div class="question">
                <label for="q12">
                    <span class="qnum">Question 12 (500 pts):</span>
                    Extract the PRIMARY Monero wallet address from the unpacked miner configuration. Monero addresses are 95 characters long and start with '4'. Provide the complete address.
                </label>
                <input type="text" id="q12" name="q12" placeholder="Enter full 95-character wallet address" data-length="95" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 13 -->
            <div class="question">
                <label for="q13">
                    <span class="qnum">Question 13 (300 pts):</span>
                    Sophisticated miners configure redundant pool connections. How many domain-based backup mining pools (NOT IP-based) are configured in the miner?
                </label>
                <input type="text" id="q13" name="q13" placeholder="Enter count" data-length="1" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 14 -->
            <div class="question">
                <label for="q14">
                    <span class="qnum">Question 14 (200 pts):</span>
                    What application-layer protocol does the miner use to communicate with the mining pool? Provide the protocol name only (e.g., HTTP, MQTT, WebSocket). Answer should be lowercase.
                </label>
                <input type="text" id="q14" name="q14" placeholder="Enter protocol name" data-length="7" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 15 -->
            <div class="question">
                <label for="q15">
                    <span class="qnum">Question 15 (450 pts):</span>
                    The miner has a secondary Monero wallet address encoded in base64. Decode the base64 strings in the miner to find the ALTERNATIVE wallet address starting with '44Mt'. Provide the complete 95-character address.
                </label>
                <input type="text" id="q15" name="q15" placeholder="Enter full 95-character alternative wallet" data-length="95" required>
                <span class="char-hint"></span>
            </div>

            <!-- Question 16 -->
            <div class="question">
                <label for="q16">
                    <span class="qnum">Question 16 (500 pts):</span>
                    The Go module <code>golang.org/x/sys</code> dependency version reveals when the malware was compiled. Extract the date from the version string format <code>v0.0.0-YYYYMMDDHHMMSS-HASH</code>. Provide the date in format: YYYY-MM-DD
                </label>
                <input type="text" id="q16" name="q16" placeholder="YYYY-MM-DD" data-length="10" required>
                <span class="char-hint"></span>
            </div>

            <button type="submit" id="submitBtn">Submit All Answers</button>
        </form>

        <div id="result" class="result hidden"></div>
        <div id="flag" class="flag hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
