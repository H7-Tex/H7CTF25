worker_processes 1;  # Reduced from auto for memory savings
worker_rlimit_nofile 1024;  # Limit open files
pid /tmp/nginx.pid;

events {
    worker_connections 256;  # Further reduced for memory savings
    use epoll;  # Efficient connection processing method
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;  # Further reduced to free connections faster
    keepalive_requests 50;  # Limit requests per connection
    types_hash_max_size 2048;
    client_max_body_size 5M;
    client_body_buffer_size 64k;  # Reduced from 128k
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Disable access logging to save I/O and memory
    access_log off;
    error_log /var/log/nginx/error.log error;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name _;

        # Admin API endpoint
        location /NeuralFluxCorpAdministrationProtectedEndpoint/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings to reduce memory
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 4k;  # Reduced from 8 buffers to 4
            proxy_busy_buffers_size 8k;
        }

        # Serve frontend static files directly with nginx (eliminates Python HTTP server)
        location / {
            root /app/web;
            index index.html;
            try_files $uri $uri/ =404;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
