        />

    <nav class="main-nav">
      <div class="nav-container">
        <div class="logo">
          <div class="logo-icon">
            <div class="neural-net">
              <div class="node"></div>
              <div class="node"></div>
              <div class="node"></div>
              <div class="connection"></div>
              <div class="connection"></div>
              <div class="connection"></div>
            </div>
          </div>
          <span class="logo-text">NEURAL FLUX CORP</span>
        </div>
        <div class="nav-menu" id="navMenu">
          <a href="index.html" class="nav-link">Home</a>
          <a href="solutions.html" class="nav-link">Solutions</a>
          <a href="products.html" class="nav-link">Products</a>
          <a href="research.html" class="nav-link">Research</a>
          <a href="about.html" class="nav-link">About</a>
          <a href="contact.html" class="nav-link">Contact</a>
          <a href="#" class="nav-link admin-link active" id="logoutBtn">
            <svg
              class="w-4 h-4 inline-block mr-1"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />

            Logout
          </a>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />

        </button>
      </div>
    </nav>

    <div class="container" style="margin-top: 8rem">
      <section class="hero-section">
        <div class="hero-content" style="text-align: center">
          <h1 class="hero-title">
            <span class="gradient-text">Admin Dashboard</span>
          </h1>
          <p class="hero-subtitle" style="margin-bottom: 3rem">
            Welcome to the Neural Flux administrative panel
          </p>

          <div
            id="userInfo"
            style="
              background: var(--bg-secondary);
              border: 1px solid var(--border);
              border-radius: 1rem;
              padding: 2rem;
              max-width: 600px;
              margin: 0 auto;
            "
          >
            <h2
              style="
                color: var(--text-primary);
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 1rem;
              "
            >
              User Information
            </h2>
            <div style="text-align: left">
              <p style="color: var(--text-secondary); margin-bottom: 0.5rem">
                <span style="color: var(--accent); font-weight: 600"
                  >Username:</span
                >
                <span id="userName">Loading...</span>
              </p>
              <p style="color: var(--text-secondary); margin-bottom: 0.5rem">
                <span style="color: var(--accent); font-weight: 600"
                  >Email:</span
                >
                <span id="userEmail">Loading...</span>
              </p>
              <p style="color: var(--text-secondary)">
                <span style="color: var(--accent); font-weight: 600"
                  >Token Expiry:</span
                >
                <span id="tokenExpiry">Loading...</span>
              </p>
            </div>
          </div>

          <div style="margin-top: 2rem">
            <a href="index.html" class="btn btn-primary">
              <span>Back to Home</span>
            </a>
          </div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
    <script>
      // Required header for API calls
      const REQUIRED_HEADER_KEY = "X-NEURALEND-KEY";
      const REQUIRED_HEADER_VALUE =
        "97b213d150a41128ae4123500d506d6422613feef8";

      // Check if user is logged in
      function checkAuth() {
        const token = localStorage.getItem("adminToken");

        if (!token) {
          // Redirect to login if no token
          window.location.href = "login.html";
          return;
        }

        // Decode JWT to get user info (basic decode, not verified)
        try {
          const payload = JSON.parse(atob(token.split(".")[1]));

          // Update user info
          document.getElementById("userName").textContent =
            payload.username || "Unknown";
          document.getElementById("userEmail").textContent =
            payload.email || "Unknown";

          // Format expiry date
          const expiryDate = new Date(payload.exp * 1000);
          document.getElementById("tokenExpiry").textContent =
            expiryDate.toLocaleString();

          // Check if token is expired
          if (payload.exp * 1000 < Date.now()) {
            alert("Session expired. Please login again.");
            localStorage.removeItem("adminToken");
            window.location.href = "login.html";
          }
        } catch (error) {
          console.error("Error decoding token:", error);
          localStorage.removeItem("adminToken");
          window.location.href = "login.html";
        }
      }

      // Logout functionality
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();

        if (confirm("Are you sure you want to logout?")) {
          localStorage.removeItem("adminToken");
          window.location.href = "login.html";
        }
      });

      // Run on page load
      checkAuth();
    </script>
  </body>
</html>
